<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRAMIO — SVG / WebP comparison</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#061833;background:#eef3f9}
*{box-sizing:border-box} body{margin:0;padding:32px 18px 56px}
main{max-width:1180px;margin:auto} h1{font-size:clamp(26px,4vw,42px);margin:0 0 8px}
p{margin:0 0 28px;color:#526174}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#fff;border:1px solid rgba(6,24,51,.1);border-radius:24px;padding:22px;box-shadow:0 12px 40px rgba(6,24,51,.08)}
.label{font-weight:700;margin-bottom:18px}.stage{height:300px;display:grid;place-items:center;background:#fff;border-radius:16px;overflow:hidden}
.stage.checker{background-color:#fff;background-image:linear-gradient(45deg,#edf1f5 25%,transparent 25%),linear-gradient(-45deg,#edf1f5 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#edf1f5 75%),linear-gradient(-45deg,transparent 75%,#edf1f5 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
img{display:block;max-width:92%;max-height:220px;object-fit:contain}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:1px solid rgba(6,24,51,.15);background:#fff;border-radius:12px;padding:11px 14px;font:inherit;cursor:pointer}
.zoom{margin-top:18px}.zoom .stage{height:430px}.zoom img{max-width:none;max-height:none;width:900px}
@media(max-width:760px){body{padding:20px 12px 40px}.grid{grid-template-columns:1fr}.stage{height:220px}.zoom .stage{height:300px;overflow:auto;place-items:start}.zoom img{width:760px;margin:50px}}
</style>
</head>
<body>
<main>
<h1>PRAMIO: SVG ↔ WebP</h1>
<p>Оба файла показаны без CSS-фильтров и трансформаций. Переключатель фона помогает проверить прозрачность и края.</p>
<div class="controls"><button id="bg">Шахматный фон</button><button id="swap">Поменять местами</button></div>
<div class="grid" id="grid">
<section class="card"><div class="label">SVG — pramio-mark.svg</div><div class="stage"><img src="/assets/pramio-mark.svg?v=71" alt="PRAMIO SVG mark"></div></section>
<section class="card"><div class="label">WebP — pramio-logo.webp</div><div class="stage"><img src="/assets/pramio-logo.webp" alt="PRAMIO WebP logo"></div></section>
</div>
<section class="card zoom"><div class="label">WebP крупно — для проверки исходной геометрии</div><div class="stage"><img src="/assets/pramio-logo.webp" alt="PRAMIO WebP enlarged"></div></section>
<script>
const stages=[...document.querySelectorAll('.stage')];
document.getElementById('bg').onclick=()=>stages.forEach(x=>x.classList.toggle('checker'));
document.getElementById('swap').onclick=()=>{const g=document.getElementById('grid');g.insertBefore(g.children[1],g.children[0])};
</script>
</main>
</body></html>
