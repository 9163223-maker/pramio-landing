<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PRAMIO Orbital Background Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#071a35;background:#f7faff}body{min-height:170vh;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}main{position:relative;z-index:2;width:min(980px,calc(100% - 24px));margin:auto;padding:14px 0 80vh}.tabs{position:sticky;top:8px;z-index:5;display:flex;gap:5px;padding:5px;border:1px solid rgba(255,255,255,.95);border-radius:18px;background:rgba(255,255,255,.82);backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(30,70,130,.1)}button{flex:1;min-height:44px;border:0;border-radius:13px;background:transparent;color:#35516f;font-weight:700;font-size:12px}button.on{background:#1466ff;color:white}.glass{margin-top:12vh;padding:24px;border:1px solid rgba(255,255,255,.92);border-radius:28px;background:rgba(255,255,255,.69);backdrop-filter:blur(19px);box-shadow:0 26px 80px rgba(25,70,140,.09),inset 0 1px 0 white}.ey{font-size:12px;font-weight:700;letter-spacing:.1em;color:#60758d}.ey:before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;border-radius:50%;background:#f28a32;box-shadow:0 0 0 5px rgba(242,138,50,.1)}h1{font-size:clamp(38px,10vw,70px);line-height:.98;letter-spacing:-.05em;margin:20px 0 15px}p{font-size:16px;line-height:1.6;color:#526780}.hint{font-size:12px;color:#7a8b9e}@media(max-width:520px){button{font-size:11px}.glass{margin-top:8vh}}</style></head><body><canvas id="c"></canvas><main><nav class="tabs"><button class="on" data-v="1">A · ORBIT</button><button data-v="2">B · DATA</button><button data-v="3">C · CONSTELLATION</button></nav><section class="glass"><div class="ey">PRAMIO BACKGROUND LAB</div><h1 id="ttl">Crystal Orbit</h1><p id="dsc">Чистая прозрачная сфера, несколько спутников и тонкие орбиты. Никакой россыпи «микроорганизмов».</p><div class="hint">Переключайте A/B/C. Анимация намеренно медленная.</div></section></main><script>
const cv=document.querySelector('#c'),x=cv.getContext('2d');let W,H,D=1,v=1,T=0;const blue='#4c91e8',orange='#f28a32';function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.7);cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',size);size();
function ellipse(cx,cy,rx,ry,rot,a,col='#5795df',lw=1){x.save();x.translate(cx,cy);x.rotate(rot);x.strokeStyle=col;x.globalAlpha=a;x.lineWidth=lw;x.beginPath();x.ellipse(0,0,rx,ry,0,0,Math.PI*2);x.stroke();x.restore();x.globalAlpha=1}
function ball(px,py,r,warm=false){let g=x.createRadialGradient(px-r*.35,py-r*.4,1,px,py,r);g.addColorStop(0,'rgba(255,255,255,.98)');g.addColorStop(.45,warm?'rgba(255,224,197,.78)':'rgba(207,231,255,.78)');g.addColorStop(1,warm?'rgba(242,138,50,.16)':'rgba(70,137,220,.15)');x.fillStyle=g;x.beginPath();x.arc(px,py,r,0,7);x.fill();x.strokeStyle=warm?'rgba(242,138,50,.42)':'rgba(71,133,207,.32)';x.lineWidth=.8;x.stroke()}
function scene(t){let bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#fcfeff');bg.addColorStop(.52,'#edf6ff');bg.addColorStop(1,'#fffaf7');x.fillStyle=bg;x.fillRect(0,0,W,H);let mobile=W<650,cx=mobile?W*.57:W*.62,cy=H*.52,R=Math.min(W,H)*(mobile?.24:.29);
let halo=x.createRadialGradient(cx,cy,R*.15,cx,cy,R*1.75);halo.addColorStop(0,'rgba(93,161,235,.10)');halo.addColorStop(.55,'rgba(111,177,238,.045)');halo.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=halo;x.beginPath();x.arc(cx,cy,R*1.75,0,7);x.fill();
if(v===1){ellipse(cx,cy,R*1.72,R*.43,-.18,.34,blue,1);ellipse(cx,cy,R*1.48,R*.65,.45,.19,'#70a9e5',.8);ellipse(cx,cy,R*1.3,R*.31,-.68,.16,orange,.8)}
if(v===2){ellipse(cx,cy,R*1.78,R*.48,-.2,.25,blue,.8);ellipse(cx,cy,R*1.5,R*.63,.44,.14,'#70a9e5',.7)}
if(v===3){ellipse(cx,cy,R*1.7,R*.44,-.18,.31,blue,.9);ellipse(cx,cy,R*1.45,R*.62,.46,.18,'#70a9e5',.8);ellipse(cx,cy,R*1.15,R*.28,-.65,.18,orange,.7)}
let gg=x.createRadialGradient(cx-R*.32,cy-R*.38,R*.03,cx,cy,R);gg.addColorStop(0,'rgba(255,255,255,.96)');gg.addColorStop(.48,'rgba(224,241,255,.54)');gg.addColorStop(.83,'rgba(157,204,244,.16)');gg.addColorStop(1,'rgba(80,146,216,.24)');x.fillStyle=gg;x.beginPath();x.arc(cx,cy,R,0,7);x.fill();x.strokeStyle='rgba(95,158,222,.27)';x.lineWidth=1;x.stroke();
if(v===2){x.save();x.beginPath();x.arc(cx,cy,R*.91,0,7);x.clip();for(let yy=-R*.72;yy<R*.75;yy+=R*.105){for(let xx=-R*.72;xx<R*.75;xx+=R*.105){let rr=Math.hypot(xx,yy);if(rr<R*.78){let wave=Math.sin(t*.0015+xx*.035+yy*.02);x.fillStyle='rgba(55,122,195,'+(.10+.08*(wave+1)/2)+')';x.beginPath();x.arc(cx+xx,cy+yy,1.05,0,7);x.fill()}}}x.restore()}
if(v===3){for(let i=0;i<18;i++){let a=i/18*Math.PI*2+t*.000035*(i%2?1:-1),rad=R*(.35+.48*((i*7)%17)/17),px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad*.72;x.fillStyle=i%8===0?'rgba(242,138,50,.65)':'rgba(60,128,200,.42)';x.beginPath();x.arc(px,py,i%5===0?1.8:1.1,0,7);x.fill();if(i>0&&i%3===0){x.strokeStyle='rgba(70,135,205,.12)';x.beginPath();x.moveTo(cx,cy);x.lineTo(px,py);x.stroke()}}}
for(let i=0;i<7;i++){let a=t*(.000045+i*.000004)+i*.91,rx=R*(1.25+(i%3)*.2),ry=R*(.34+(i%2)*.18),rot=-.2+(i%3)*.34,px=cx+Math.cos(a)*rx*Math.cos(rot)-Math.sin(a)*ry*Math.sin(rot),py=cy+Math.cos(a)*rx*Math.sin(rot)+Math.sin(a)*ry*Math.cos(rot);ball(px,py,i===0?R*.11:R*(.035+(i%3)*.015),i===0||i===5)}
}
function loop(t){T=t;scene(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);document.querySelectorAll('button').forEach(b=>b.onclick=()=>{v=+b.dataset.v;document.querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b));let z=v===1?['Crystal Orbit','Чистая прозрачная сфера, несколько спутников и тонкие орбиты. Никакой россыпи «микроорганизмов».']:v===2?['Data Globe','Сфера с аккуратной цифровой точечной сеткой внутри. Точки принадлежат объекту, а не загрязняют весь экран.']:['Constellation Core','Чуть более технологичная система: узлы внутри сферы, орбиты и редкие медные сигналы.'];ttl.textContent=z[0];dsc.textContent=z[1]})</script></body></html>
