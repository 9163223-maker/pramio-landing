<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PRAMIO Background Lab — 10 concepts</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,Arial,sans-serif;color:#061833;background:#f7faff}body{min-height:180vh;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}main{position:relative;z-index:2;width:min(980px,calc(100% - 24px));margin:auto;padding:12px 0 85vh}.tabs{position:sticky;top:8px;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:6px;border:1px solid rgba(255,255,255,.95);border-radius:20px;background:rgba(255,255,255,.80);backdrop-filter:blur(20px);box-shadow:0 12px 40px rgba(30,70,130,.1)}button{min-height:42px;border:0;border-radius:13px;background:transparent;color:#35516f;font:700 11px/1.15 Arial}button.on{background:#1466ff;color:#fff}.glass{margin-top:9vh;padding:26px;border:1px solid rgba(255,255,255,.88);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.78),rgba(244,249,255,.58));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 28px 85px rgba(20,70,150,.12),inset 0 1px 0 rgba(255,255,255,.98)}.ey{font-size:12px;font-weight:700;letter-spacing:.09em;color:#61768f}.ey:before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;border-radius:50%;background:#f28a32;box-shadow:0 0 0 5px rgba(242,138,50,.10)}h1{font-size:clamp(38px,10vw,68px);line-height:.98;letter-spacing:-.05em;margin:20px 0 14px}p{font-size:16px;line-height:1.58;color:#526780}.cta{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:10px;padding:0 18px;border-radius:14px;background:#1466ff;color:#fff;font-weight:700;font-size:14px}.hint{margin-top:14px;font-size:12px;color:#7b8da2}@media(max-width:620px){.tabs{grid-template-columns:repeat(5,1fr)}button{font-size:10px;padding:0 2px}.glass{margin-top:7vh;padding:22px}}</style></head><body><canvas id="c"></canvas><main><nav class="tabs"><button class="on" data-v="1">01</button><button  data-v="2">02</button><button  data-v="3">03</button><button  data-v="4">04</button><button  data-v="5">05</button><button  data-v="6">06</button><button  data-v="7">07</button><button  data-v="8">08</button><button  data-v="9">09</button><button  data-v="10">10</button></nav><section class="glass"><div class="ey">PRAMIO · BACKGROUND LAB</div><h1 id="ttl">Atmosphere</h1><p id="dsc">Мягкие световые поля и несколько чистых световых дуг.</p><span class="cta">Обсудить проект</span><div class="hint">Это стекло специально близко к текущей системе PRAMIO. Переключайте 01–10.</div></section></main><script>
const cv=document.querySelector('#c'),x=cv.getContext('2d');let W,H,D=1,v=1;const B=[54,123,207],C=[42,169,203],O=[242,138,50];function rgba(c,a){return 'rgba('+c.join(',')+','+a+')'}function sz(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.6);cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);sz();function bg(){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fcfeff');g.addColorStop(.52,'#edf6ff');g.addColorStop(1,'#fffaf7');x.fillStyle=g;x.fillRect(0,0,W,H)}function line(y,amp,t,col,a,w=1){x.strokeStyle=rgba(col,a);x.lineWidth=w;x.beginPath();for(let xx=-20;xx<W+20;xx+=8){let yy=y+Math.sin(xx*.009+t)*amp+Math.sin(xx*.003-t*.6)*amp*.45;xx<0?x.moveTo(xx,yy):x.lineTo(xx,yy)}x.stroke()}function dot(px,py,r,col,a){x.fillStyle=rgba(col,a);x.beginPath();x.arc(px,py,r,0,7);x.fill()}
function draw(t){bg();let tt=t*.00025;
if(v===1){for(let i=0;i<5;i++)line(H*(.2+i*.15),18+i*7,tt+i,B,.10-i*.008,.8);let g=x.createRadialGradient(W*.76,H*.25,0,W*.76,H*.25,W*.32);g.addColorStop(0,'rgba(242,138,50,.07)');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H)}
if(v===2){for(let i=0;i<42;i++){let a=i*2.399+tt*.3,r=(35+(i*17)%190),cx=W*.62,cy=H*.55,px=cx+Math.cos(a)*r*1.2,py=cy+Math.sin(a)*r*.7;dot(px,py,1.2+(i%5)*.22,i%13===0?O:(i%4===0?C:B),i%13===0?.55:.30)}}
if(v===3){for(let i=0;i<7;i++)line(H*(.16+i*.115),28+i*8,tt*(.45+i*.03)+i,B,.13,.8);for(let i=0;i<3;i++)line(H*(.3+i*.21),45,tt*.33+i,O,.055,.7)}
if(v===4){let pts=[];for(let i=0;i<26;i++){let px=W*(.08+((i*37)%89)/100),py=H*(.12+((i*53)%78)/100)+Math.sin(tt+i)*8;pts.push([px,py]);dot(px,py,i%6===0?2:1.2,i%9===0?O:B,i%9===0?.55:.38)}for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){let d=Math.hypot(pts[i][0]-pts[j][0],pts[i][1]-pts[j][1]);if(d<105){x.strokeStyle=rgba(B,(1-d/105)*.11);x.beginPath();x.moveTo(...pts[i]);x.lineTo(...pts[j]);x.stroke()}}}
if(v===5){for(let i=0;i<5;i++){let cx=W*(.15+i*.2)+Math.sin(tt+i)*18,cy=H*(.25+(i%2)*.34),rx=55+(i%3)*24,ry=22+(i%2)*12;x.save();x.translate(cx,cy);x.rotate(tt*.08+i);let g=x.createRadialGradient(-rx*.25,-ry*.2,2,0,0,rx);g.addColorStop(0,'rgba(255,255,255,.72)');g.addColorStop(.65,'rgba(116,184,237,.10)');g.addColorStop(1,i===2?'rgba(242,138,50,.10)':'rgba(68,139,216,.16)');x.fillStyle=g;x.beginPath();x.ellipse(0,0,rx,ry,0,0,7);x.fill();x.restore()}}
if(v===6){for(let i=0;i<7;i++){x.save();x.translate(W*.54,H*.52);x.rotate(-.4+i*.18);x.strokeStyle=rgba(i===4?O:B,i===4?.15:.11);x.lineWidth=.75;x.beginPath();x.ellipse(0,0,W*(.28+i*.025),H*(.09+i*.012),0,0,7);x.stroke();x.restore();let a=tt*.22+i,px=W*.54+Math.cos(a)*W*(.28+i*.025),py=H*.52+Math.sin(a)*H*(.09+i*.012);dot(px,py,i%3===0?2.2:1.3,i===4?O:B,i===4?.6:.4)}}
if(v===7){let cx=W*.58,cy=H*.53;for(let i=0;i<36;i++){let a=i/36*6.283+Math.sin(tt*.2)*.08,r=Math.min(W,H)*(.10+.34*(i%9)/9),bend=.5*Math.sin(i*.8+tt*.25);x.strokeStyle=rgba(i%11===0?O:B,i%11===0?.12:.075);x.lineWidth=.7;x.beginPath();x.moveTo(cx,cy);x.quadraticCurveTo(cx+Math.cos(a+bend)*r*.5,cy+Math.sin(a-bend)*r*.5,cx+Math.cos(a)*r,cy+Math.sin(a)*r);x.stroke()}dot(cx,cy,3,O,.42)}
if(v===8){for(let i=0;i<24;i++){let px=W*((i*41)%101)/100,py=H*(.12+((i*67)%78)/100)+Math.sin(tt+i)*7,s=3+(i%5)*2;x.save();x.translate(px,py);x.rotate(tt*.08+i);x.strokeStyle=rgba(i%10===0?O:B,i%10===0?.35:.22);x.lineWidth=.8;x.strokeRect(-s,-s,s*2,s*2);x.restore()}}
if(v===9){for(let row=0;row<17;row++)for(let col=0;col<24;col++){let px=W*(col/23),base=H*(.30+row*.025),py=base+Math.sin(col*.42+tt+row*.18)*24+Math.cos(row*.35+tt*.45)*9;dot(px,py,.8+(row%4)*.12,row%9===0&&col%8===0?O:B,row%9===0&&col%8===0?.38:.18)}}
if(v===10){for(let i=0;i<8;i++){let y=H*(.12+i*.105);line(y,55+i*5,tt*.18+i*.7,i===5?O:(i%2?C:B),i===5?.06:.075,1.4)}}
requestAnimationFrame(draw)}requestAnimationFrame(draw);
const names=[['Atmosphere','Мягкие световые поля и несколько чистых световых дуг.'],['Micro Spheres','Очень маленькие стеклянные сферы в спокойном брауновском потоке.'],['Flow','Тонкие световые ленты и волны без крупных объектов.'],['Mesh','Редкая чистая сеть из узлов и тонких связей.'],['Liquid Glass','Небольшие прозрачные стеклянные формы, медленно меняющие положение.'],['Orbit Light','Только тонкие орбиты и микроспутники — без центральной планеты.'],['Magnetic','Чистые линии магнитного поля с одним слабым центром притяжения.'],['Fragments','Редкие геометрические микрофрагменты с большим количеством воздуха.'],['Grid Wave','Точечная цифровая сетка, которая мягко деформируется волной.'],['Aurora','Почти невесомые световые потоки — самый абстрактный вариант.']];document.querySelectorAll('button').forEach(b=>b.onclick=()=>{v=+b.dataset.v;document.querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b));ttl.textContent=names[v-1][0];dsc.textContent=names[v-1][1]})</script></body></html>
