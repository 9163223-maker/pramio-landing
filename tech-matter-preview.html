<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PRAMIO Field Lab II</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#061833;background:#f7faff}body{min-height:190vh;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}main{position:relative;z-index:2;width:min(980px,calc(100% - 24px));margin:auto;padding:10px 0 100vh}.tabs{position:sticky;top:7px;z-index:9;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:5px;border:1px solid #fff;border-radius:18px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);box-shadow:0 10px 35px rgba(25,70,140,.1)}button{min-height:40px;border:0;border-radius:12px;background:transparent;color:#35516f;font:700 10px Arial}button.on{background:#1466ff;color:#fff}.glass{margin-top:10vh;padding:24px;border:1px solid rgba(255,255,255,.9);border-radius:27px;background:linear-gradient(145deg,rgba(255,255,255,.76),rgba(244,249,255,.57));backdrop-filter:blur(21px);box-shadow:0 27px 80px rgba(20,70,150,.11),inset 0 1px 0 #fff}.ey{font:700 12px Arial;letter-spacing:.09em;color:#61768f}.ey:before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;border-radius:50%;background:#f28a32;box-shadow:0 0 0 5px rgba(242,138,50,.1)}h1{font-size:clamp(38px,10vw,68px);line-height:.98;letter-spacing:-.05em;margin:20px 0 14px}p{font-size:16px;line-height:1.58;color:#526780}.cta{display:inline-flex;align-items:center;min-height:48px;margin-top:8px;padding:0 18px;border-radius:14px;background:#1466ff;color:#fff;font-weight:700;font-size:14px}.second{margin-top:62vh}.hint{font-size:12px;color:#7b8da2}@media(max-width:620px){.glass{padding:22px}.second{margin-top:58vh}}</style></head><body><canvas id="c"></canvas><main><nav class="tabs"><button class="on" data-v="11">11</button><button  data-v="12">12</button><button  data-v="13">13</button><button  data-v="14">14</button><button  data-v="15">15</button><button  data-v="16">16</button><button  data-v="17">17</button><button  data-v="18">18</button><button  data-v="19">19</button><button  data-v="20">20</button></nav><section class="glass"><div class="ey">PRAMIO · DISTRIBUTED FIELD</div><h1 id="ttl">Signal Rivers</h1><p id="dsc">Несколько технологических потоков проходят через весь viewport и продолжаются под стеклом.</p><span class="cta">Обсудить проект</span></section><section class="glass second"><div class="ey">ПРОВЕРКА ГЛУБИНЫ</div><h1>Фон продолжается</h1><p>Второй блок показывает, что система не привязана к одному объекту и существует как единая среда по всему экрану.</p></section></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d');let W,H,D,v=11,px=0,py=0,tx=0,ty=0;const B=[52,120,205],C=[36,169,203],O=[242,138,50];const R=(q,a)=>'rgba('+q.join(',')+','+a+')';function sz(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.6);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',sz);addEventListener('pointermove',e=>{tx=(e.clientX/W-.5)*32;ty=(e.clientY/H-.5)*24},{passive:true});if(window.DeviceOrientationEvent)addEventListener('deviceorientation',e=>{if(e.gamma!=null){tx=Math.max(-30,Math.min(30,e.gamma*.72));ty=Math.max(-22,Math.min(22,(e.beta||0)*.28))}},{passive:true});sz();function bg(){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#f9fcff');g.addColorStop(.52,'#eaf4ff');g.addColorStop(1,'#fff8f3');x.fillStyle=g;x.fillRect(0,0,W,H)}function path(seed,t,amp=.09,col=B,a=.1,lw=.7){x.strokeStyle=R(col,a);x.lineWidth=lw;x.beginPath();for(let xx=-30;xx<W+30;xx+=7){let yy=H*(seed+.08*Math.sin(xx/W*6.28+seed*9+t)+amp*Math.sin(xx/W*12.5-t*.7+seed*13));xx<0?x.moveTo(xx,yy):x.lineTo(xx,yy)}x.stroke()}function dot(px,py,r,col,a){x.fillStyle=R(col,a);x.beginPath();x.arc(px,py,r,0,7);x.fill()}function frame(ms){bg();px+=(tx-px)*.055;py+=(ty-py)*.055;x.save();x.translate(px,py);let t=ms*.00038;
if(v===11){for(let i=0;i<9;i++)path(.08+i*.105,t*(.35+i*.025),.045,i===6?O:(i%3===0?C:B),i===6?.28:.29,.75)}
if(v===12){for(let row=0;row<12;row++)for(let col=0;col<18;col++){let px=(col/17)*W+Math.sin(t+row)*8,py=(row/11)*H+Math.sin(col*.55+t+row*.2)*12;dot(px,py,.75+(row+col)%3*.25,(row*7+col)%37===0?O:B,(row*7+col)%37===0?.48:.20);if(col<17&&row%2===0){x.strokeStyle=R(B,.045);x.beginPath();x.moveTo(px,py);x.lineTo(px+W/17,py+Math.sin((col+1)*.55+t+row*.2)*8);x.stroke()}}}
if(v===13){for(let i=0;i<65;i++){let px=((i*73)%101)/100*W,py=((i*47)%97)/100*H,dx=Math.sin(t+i)*16,dy=Math.cos(t*.8+i*1.3)*12;dot(px+dx,py+dy,i%9===0?1.8:.8,i%17===0?O:(i%5===0?C:B),i%17===0?.82:.58)}}
if(v===14){for(let i=0;i<13;i++){let y=H*(.04+i*.08);path(y/H,t*.15+i*.4,.018,i%7===0?O:B,i%7===0?.22:.22,.65)}for(let i=0;i<28;i++){let px=((i*43)%101)/100*W,py=((i*61)%101)/100*H;dot(px,py,1.1,i%11===0?O:B,i%11===0?.78:.58)}}
if(v===15){for(let i=0;i<7;i++){let px=W*(.1+i*.15)+Math.sin(t+i)*30;for(let j=0;j<7;j++){let py=H*(.08+j*.15)+Math.cos(t*.8+i+j)*20;let s=2+(i+j)%3;x.save();x.translate(px,py);x.rotate(t*.1+i);x.strokeStyle=R((i+j)%13===0?O:B,(i+j)%13===0?.35:.15);x.strokeRect(-s,-s,s*2,s*2);x.restore()}}}
if(v===16){for(let i=0;i<8;i++){let phase=t*.12+i*.8;x.strokeStyle=R(i===5?O:(i%2?C:B),i===5?.06:.07);x.lineWidth=1.2;x.beginPath();for(let yy=-20;yy<H+20;yy+=7){let xx=W*(.08+i*.125)+Math.sin(yy*.009+phase)*38;yy<0?x.moveTo(xx,yy):x.lineTo(xx,yy)}x.stroke()}}
if(v===17){for(let i=0;i<90;i++){let lane=i%6,px=((i*31)%103)/103*W,py=((i*71)%107)/107*H,a=t+lane*.9;px+=Math.cos(a)*18;py+=Math.sin(a*.7)*18;dot(px,py,i%14===0?2:.75,i%19===0?O:B,i%19===0?.80:.54)}}
if(v===18){for(let i=0;i<8;i++){let seed=.08+i*.12;path(seed,t*.1+i*.5,.025,i%5===0?O:B,i%5===0?.20:.20,.55);for(let j=0;j<6;j++){let px=W*((j/5)+.04*Math.sin(t+i+j)),py=H*(seed+.08*Math.sin(px/W*6.28+seed*9+t*.1+i*.5));dot(px,py,1.1,i%5===0?O:B,i%5===0?.78:.58)}}}
if(v===19){for(let i=0;i<6;i++){let cx=W*(.08+i*.19),cy=H*(.15+((i*3)%5)*.17);for(let k=0;k<4;k++){x.strokeStyle=R(i===4&&k===2?O:B,i===4&&k===2?.055:.045);x.lineWidth=.7;x.beginPath();x.arc(cx,cy,35+k*22+Math.sin(t+i)*5,0,7);x.stroke()}}}
if(v===20){for(let i=0;i<12;i++){let col=i%6===0?O:(i%2?C:B);path(.03+i*.085,t*.08+i*.55,.065,col,i%6===0?.18:.18,1.25)}for(let i=0;i<38;i++){let px=((i*59)%101)/100*W,py=((i*83)%101)/100*H;dot(px,py,1.05,B,.46)}}
x.restore();requestAnimationFrame(frame)}requestAnimationFrame(frame);const N=[['Signal Rivers','Несколько технологических потоков проходят через весь viewport и продолжаются под стеклом.'],['Living Lattice','Редкая деформируемая решётка покрывает всю сцену, но остаётся почти невесомой.'],['Brownian Glass','Микросферы распределены по всему экрану и двигаются малыми независимыми траекториями.'],['Field + Nodes','Тонкие линии поля проходят по всей высоте, между ними редкие технологические узлы.'],['Micro Geometry','Микрогеометрия равномерно живёт в пространстве, без единственного центра композиции.'],['Vertical Flux','Вертикальные световые потоки медленно взаимодействуют и проходят за всеми блоками.'],['Swarm Lanes','Очень мелкие частицы движутся несколькими спокойными потоками по всей сцене.'],['Signal Threads','Система тонких нитей с редкими узлами — читается как инфраструктура, а не декор.'],['Field Rings','Несколько слабых локальных полей распределены по экрану; ни одно не становится главным объектом.'],['Hybrid Matter','Световые потоки + микроточки: наиболее насыщенная, но всё ещё фоновая технологическая среда.']];document.querySelectorAll('button').forEach(b=>b.onclick=()=>{v=+b.dataset.v;document.querySelectorAll('button').forEach(q=>q.classList.toggle('on',q===b));ttl.textContent=N[v-11][0];dsc.textContent=N[v-11][1]})</script></body></html>
