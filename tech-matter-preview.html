<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>PRAMIO Matter Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#071a35;background:#f7faff}body{min-height:160vh;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}main{position:relative;z-index:2;width:min(960px,calc(100% - 24px));margin:auto;padding:18px 0 75vh}.switch{position:sticky;top:10px;z-index:5;display:flex;gap:6px;padding:6px;border:1px solid #fff;border-radius:18px;background:rgba(255,255,255,.78);backdrop-filter:blur(18px);box-shadow:0 10px 35px rgba(30,70,130,.12)}button{flex:1;min-height:44px;border:0;border-radius:13px;background:transparent;color:#28445f;font-weight:700}button.on{background:#1466ff;color:#fff}.glass{margin-top:14vh;padding:24px;border:1px solid rgba(255,255,255,.9);border-radius:27px;background:rgba(255,255,255,.66);backdrop-filter:blur(17px);box-shadow:0 25px 75px rgba(25,70,140,.1),inset 0 1px 0 #fff}.ey{font-size:12px;font-weight:700;letter-spacing:.09em;color:#60758d}.ey:before{content:"";display:inline-block;width:7px;height:7px;margin-right:9px;border-radius:50%;background:#f28a32;box-shadow:0 0 0 5px rgba(242,138,50,.1)}h1{font-size:clamp(38px,10vw,70px);line-height:.98;letter-spacing:-.05em;margin:20px 0 15px}p{font-size:16px;line-height:1.6;color:#526780}.legend{margin-top:12px;font-size:12px;color:#75869b}</style></head><body><canvas id="c"></canvas><main><nav class="switch"><button data-v="1">V1 · Air</button><button class="on" data-v="2">V2 · Clusters</button><button data-v="3">V3 · Neural</button></nav><section class="glass"><div class="ey">PRAMIO MATTER LAB</div><h1 id="title">Кластеры</h1><p id="desc">Четыре живых поля: плотнее, заметнее, но всё ещё спокойно под стеклом.</p><div class="legend">Переключайте варианты сверху. Это реальный Canvas в обычной GitHub Pages-странице.</div></section></main><script>
const cv=document.querySelector('#c'),x=cv.getContext('2d');let W,H,D,ps=[],mode=2,mouse={x:-9e3,y:-9e3};const O=[242,138,50],B=[35,91,165],C=[28,154,190];function rgba(c,a){return 'rgba('+c.join(',')+','+a+')'}function reset(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.6);cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0);let n=mode===1?(W<700?115:180):(mode===2?(W<700?145:220):(W<700?165:250));ps=Array.from({length:n},(_,i)=>({x:Math.random()*W,y:Math.random()*H,vx:0,vy:0,g:i%4,a:Math.random()*6.28,r:(mode===1?.7:.9)+Math.random()*(mode===3?1.8:1.3),o:Math.random()<(mode===3?.08:.055)}))}
function ctr(g,t){let P=[[.15,.22],[.8,.27],[.65,.74],[.18,.79]][g];return{x:W*(P[0]+.05*Math.sin(t*.0001+g*1.7)),y:H*(P[1]+.05*Math.cos(t*.00008+g*1.3))}}
function bg(){let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fcfdff');g.addColorStop(.5,'#eff6ff');g.addColorStop(1,'#fff9f5');x.fillStyle=g;x.fillRect(0,0,W,H)}
function frame(t){bg();for(const p of ps){let q=ctr(p.g,t),dx=q.x-p.x,dy=q.y-p.y;if(mode===1){p.vx+=dx*.000015;p.vy+=dy*.000015}else{let rad=mode===3?95:125,ang=p.a+t*(mode===3?.00009:.000055),tx=q.x+Math.cos(ang)*rad*(.35+.65*((p.g+1)%4)/4),ty=q.y+Math.sin(ang)*rad*.55;p.vx+=(tx-p.x)*(mode===3?.0038:.0027);p.vy+=(ty-p.y)*(mode===3?.0038:.0027)}p.vx*=.92;p.vy*=.92;p.x+=p.vx;p.y+=p.vy}
let lim=mode===1?62:(mode===2?82:105),alpha=mode===1?.11:(mode===2?.20:.25);x.lineWidth=mode===3?.75:.6;for(let i=0;i<ps.length;i++){let a=ps[i],links=0;for(let j=i+1;j<ps.length&&links<(mode===3?5:3);j++){let b=ps[j];if(mode!==3&&a.g!==b.g)continue;let d=Math.hypot(a.x-b.x,a.y-b.y);if(d<lim){x.strokeStyle=rgba(a.o||b.o?O:B,(1-d/lim)*alpha);x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();links++}}}for(const p of ps){let col=p.o?O:(p.g===2?C:B);if(mode===3&&p.r>1.7){x.fillStyle=rgba(col,.06);x.beginPath();x.arc(p.x,p.y,p.r+5,0,7);x.fill()}x.fillStyle=rgba(col,p.o?.8:(mode===1?.38:.62));x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}requestAnimationFrame(frame)}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=+b.dataset.v;document.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z===b));let z=mode===1?['Воздушная материя','Самый деликатный вариант: редкие точки и тонкие связи.']:mode===2?['Кластеры','Четыре живых поля: плотнее, заметнее, но всё ещё спокойно под стеклом.']:['Нейронная сеть','Самый технологичный: больше связей, глубины и заметных узлов.'];title.textContent=z[0];desc.textContent=z[1];reset()});addEventListener('resize',reset);reset();requestAnimationFrame(frame);
</script></body></html>
