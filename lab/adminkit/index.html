<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store"><title>AdminKIT — Design Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15283d;background:#edf5fa}button{font:inherit;color:inherit;cursor:pointer}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 38% at 12% 2%,rgba(113,196,244,.20),transparent 72%),radial-gradient(60% 38% at 95% 35%,rgba(187,222,242,.24),transparent 70%),linear-gradient(180deg,#f3f9fd,#edf4f8)}
.app{position:relative;width:min(100%,430px);min-height:100dvh;margin:auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom));display:grid;gap:10px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.79),rgba(246,251,255,.64));border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(50,81,110,.08);backdrop-filter:blur(22px) saturate(1.18);-webkit-backdrop-filter:blur(22px) saturate(1.18)}
.context{border-radius:25px;padding:13px;display:grid;gap:10px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:baseline;gap:7px;min-width:0}.brand b{font-size:22px;letter-spacing:-.04em}.brand i{font-style:normal;color:#1476df}.brand span{font-size:13px;color:#718397}.surface-links{display:flex;gap:6px;flex:0 0 auto}.surface-links button{border:0;min-width:44px;height:44px;padding:0 10px;border-radius:15px;background:rgba(232,242,250,.82);color:#41647f;font-size:12px;font-weight:850}.surface-links button:last-child{color:#1476df;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(20,118,223,.09)}
.channel{border:0;width:100%;min-height:62px;border-radius:18px;background:rgba(255,255,255,.86);box-shadow:inset 0 0 0 1px rgba(35,105,179,.10);padding:9px 12px;display:flex;align-items:center;justify-content:space-between;text-align:left}.channel small{display:block;font-size:13px;color:#718397}.channel strong{display:block;font-size:19px;line-height:1.2;margin-top:2px}.channel em{font-style:normal;font-size:13px;font-weight:800;color:#1476df}
.spaces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.spaces button{border:0;min-height:48px;border-radius:16px;background:rgba(229,240,249,.74);font-size:14px;font-weight:800;color:#526b82}.spaces button.active{background:rgba(255,255,255,.95);color:#1476df;box-shadow:0 5px 16px rgba(48,80,112,.08),inset 0 0 0 1px rgba(20,118,223,.11)}
.confirm{font-size:13px;color:#718397;padding:0 3px;line-height:1.35}.confirm b{color:#30485f}
.card{border-radius:22px;overflow:hidden}.title{min-height:34px;padding:10px 13px 5px;font-size:14px;font-weight:850;color:#5f7589;display:flex;align-items:baseline;justify-content:space-between;gap:8px}.title span{font-size:12px;font-weight:650;color:#8393a2;white-space:nowrap}
.audience{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:4px 6px 10px}.metric{border:0;background:transparent;min-width:0;min-height:64px;padding:7px 8px;text-align:left}.metric+.metric{border-left:1px solid rgba(91,119,145,.17)}.metric small{display:block;font-size:12px;line-height:1.15;color:#6d8092;min-height:28px}.metric b{display:block;font-size:20px;line-height:1.1;color:#1476df;margin-top:3px;white-space:nowrap}.metric.good b{color:#397b5c}
.alert{border:0;width:100%;min-height:62px;padding:9px 12px;background:#fff6e9;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}.ico{width:40px;height:40px;border-radius:13px;background:#ffe7c8;display:grid;place-items:center;font-weight:900;color:#b56825}.rowtext{min-width:0}.rowtext b{font-size:15px}.rowtext small{display:block;font-size:13px;color:#786d61;margin-top:2px}.go{font-size:13px;font-weight:850;color:#a45d21}
.leads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:4px 6px 10px}.lead{border:0;background:transparent;min-height:60px;text-align:left;padding:7px 8px}.lead+.lead{border-left:1px solid rgba(91,119,145,.17)}.lead small{display:block;font-size:12px;color:#6d8092;line-height:1.2;min-height:29px}.lead b{display:block;font-size:20px;margin-top:2px}.lead.new b{color:#1476df}.lead.work b{color:#ae633d}.lead.done b{color:#397b5c}
.content button,.campaign{border:0;width:100%;min-height:61px;background:transparent;padding:9px 12px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}.content button+button{border-top:1px solid rgba(91,119,145,.16)}.content .ico{background:#edf5fd;color:#1476df}.content b,.campaign b{font-size:15px}.content small,.campaign small{display:block;font-size:13px;color:#6d8092;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content .go,.campaign .go{color:#1476df}.campaign .ico{background:#fff0de;color:#bd6c28}
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(402px,calc(100vw - 20px));padding:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;border-radius:24px;background:rgba(238,247,253,.76);border:1px solid rgba(255,255,255,.94);box-shadow:0 14px 38px rgba(38,70,103,.15),inset 0 1px 0 #fff;backdrop-filter:blur(30px) saturate(1.35);-webkit-backdrop-filter:blur(30px) saturate(1.35)}
.nav button{border:0;min-width:0;min-height:58px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:#60778d}.nav button b{font-size:18px;line-height:1;font-weight:700}.nav button.active{background:rgba(255,255,255,.94);color:#1476df;box-shadow:0 5px 16px rgba(47,82,116,.08)}
.sheet{position:fixed;z-index:50;inset:0;background:rgba(20,35,50,.16);display:none;align-items:flex-end;justify-content:center;padding:12px}.sheet.open{display:flex}.sheetbox{width:min(410px,100%);border-radius:26px;padding:10px;background:rgba(248,252,255,.94);box-shadow:0 20px 60px rgba(30,55,80,.22);backdrop-filter:blur(28px)}.sheetbox h3{margin:8px 8px 10px;font-size:17px}.choice{width:100%;min-height:52px;border:0;border-top:1px solid #e0e9f0;background:transparent;text-align:left;padding:8px 10px;font-weight:750}.choice:first-of-type{border-top:0}
@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.context{padding:11px}.audience{padding-left:3px;padding-right:3px}.metric{padding:6px 5px}.metric small,.lead small{font-size:11px}.metric b{font-size:18px}.spaces button{font-size:13px}.nav{width:calc(100vw - 14px)}.nav button{font-size:11px}}
</style></head><body><main class="app">
<section class="context glass"><div class="brandrow"><div class="brand"><b>AdminK<i>IT</i></b><span>от PRAMIO.RU</span></div><div class="surface-links"><button data-exit="max" aria-label="Перейти в MAX">MAX</button><button data-exit="web" aria-label="Перейти в Web-панель">Web</button></div></div><button class="channel" id="channelBtn"><span><small>Выбранный канал</small><strong id="channelName">Тётя Лида знает</strong></span><em>Выбрать ›</em></button><div class="confirm">Рабочая область <b>Olga.style</b> · <span id="confirmChannel">Тётя Лида знает</span></div></section>
<section class="card glass"><div class="title"><span>Аудитория · сегодня</span><span>00:00–сейчас · МСК</span></div><div class="audience"><button class="metric"><small>Подписались</small><b>+41</b></button><button class="metric"><small>Отписались</small><b>−7</b></button><button class="metric good"><small>Изменение</small><b>+34</b></button><button class="metric"><small>Всего</small><b>4 826</b></button></div></section>
<section class="card glass"><div class="title">Важное</div><button class="alert"><span class="ico">!</span><span class="rowtext"><b>2 лида ждут ответа</b><small>Новые обращения требуют реакции</small></span><span class="go">Открыть</span></button></section>
<section class="card glass"><div class="title">Лиды</div><div class="leads"><button class="lead new"><small>Неотвеченные</small><b>2</b></button><button class="lead work"><small>В работе</small><b>4</b></button><button class="lead done"><small>Отвеченные</small><b>18</b></button></div></section>
<section class="card glass content"><div class="title">Контент</div><button><span class="ico">◷</span><span class="rowtext"><b>Запланированный пост</b><small>Сегодня · 19:30 · «Осенняя капсула»</small></span><span class="go">Открыть</span></button><button><span class="ico">✓</span><span class="rowtext"><b>Последний пост</b><small>Сегодня · 09:15 · опубликован</small></span><span class="go">Открыть</span></button></section>
<section class="card glass"><div class="title">Продвижение</div><button class="campaign"><span class="ico">↗</span><span class="rowtext"><b>Рекламные кампании</b><small>Ссылки, источники и результаты</small></span><span class="go">Перейти</span></button></section>
</main><nav class="nav glass"><button class="active"><b>⌂</b>Главная</button><button><b>▤</b>Контент</button><button><b>♙</b>Лиды</button><button><b>▥</b>Статистика</button><button><b>•••</b>Ещё</button></nav>
<div class="sheet" id="sheet"><div class="sheetbox"><h3>Выберите канал</h3><button class="choice">Тётя Лида знает</button><button class="choice">Olga.style</button><button class="choice">PRAMIO</button></div></div>
<script>
const sheet=document.getElementById('sheet'),nameEl=document.getElementById('channelName'),confirmChannel=document.getElementById('confirmChannel');
document.getElementById('channelBtn').onclick=()=>sheet.classList.add('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{nameEl.textContent=b.textContent;confirmChannel.textContent=b.textContent;sheet.classList.remove('open')});

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script></body></html>
