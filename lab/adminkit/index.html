<script>
function updateMoscowClock(){const now=new Date(),parts=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now),get=t=>parts.find(p=>p.type===t)?.value||'';document.getElementById('moscowDate').textContent=get('day')+' '+get('month');document.getElementById('moscowTime').textContent=get('hour')+':'+get('minute')}updateMoscowClock();setInterval(updateMoscowClock,60000);
const sheet=document.getElementById('sheet'),nameEl=document.getElementById('channelName');
document.getElementById('channelBtn').onclick=()=>sheet.classList.add('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{nameEl.textContent=b.textContent;sheet.classList.remove('open')});

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script></body></html>
