<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta http-equiv="Cache-Control" content="no-store"><title>AdminKIT — Design Lab</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15283d;background:#edf5fa}button{font:inherit;color:inherit;cursor:pointer}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 38% at 12% 2%,rgba(113,196,244,.20),transparent 72%),radial-gradient(60% 38% at 95% 35%,rgba(187,222,242,.24),transparent 70%),linear-gradient(180deg,#f3f9fd,#edf4f8)}
.app{position:relative;width:min(100%,430px);min-height:100dvh;margin:auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom));display:grid;gap:10px}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.79),rgba(246,251,255,.64));border:1px solid rgba(255,255,255,.92);box-shadow:inset 0 1px 0 #fff,0 12px 30px rgba(50,81,110,.08);backdrop-filter:blur(22px) saturate(1.18);-webkit-backdrop-filter:blur(22px) saturate(1.18)}
.context{border-radius:25px;padding:13px;display:grid;gap:10px}.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:baseline;gap:7px;min-width:0}.brand b{font-size:22px;letter-spacing:-.04em}.brand i{font-style:normal;color:#1476df}.brand span{font-size:13px;color:#718397}.surface-links{display:flex;gap:6px;flex:0 0 auto}.surface-links button{border:0;min-width:44px;height:44px;padding:0 10px;border-radius:15px;background:rgba(232,242,250,.82);color:#41647f;font-size:12px;font-weight:850}.surface-links button:last-child{color:#1476df;background:rgba(255,255,255,.9);box-shadow:inset 0 0 0 1px rgba(20,118,223,.09)}

.card{border-radius:22px;overflow:hidden}.title{min-height:34px;padding:10px 13px 5px;font-size:14px;font-weight:850;color:#5f7589;display:flex;align-items:baseline;justify-content:space-between;gap:8px}.title span{font-size:12px;font-weight:650;color:#8393a2;white-space:nowrap}

.alert{border:0;width:100%;min-height:62px;padding:9px 12px;background:#fff6e9;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}.ico{width:40px;height:40px;border-radius:13px;background:#f2dfd2;display:grid;place-items:center;font-weight:900;color:#a7653f}.rowtext{min-width:0}.rowtext b{font-size:15px}.rowtext small{display:block;font-size:13px;color:#786d61;margin-top:2px}.go{font-size:13px;font-weight:850;color:#98603f}

.content button,.campaign{border:0;width:100%;min-height:61px;background:transparent;padding:9px 12px;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left}.content button+button{border-top:1px solid rgba(91,119,145,.16)}.content .ico{background:#edf5fd;color:#1476df}.content b,.campaign b{font-size:15px}.content small,.campaign small{display:block;font-size:13px;color:#6d8092;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.content .go,.campaign .go{color:#1476df}.campaign .ico{background:#f2e3d8;color:#9d6240}
.nav{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(402px,calc(100vw - 20px));padding:6px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;border-radius:24px;background:rgba(238,247,253,.76);border:1px solid rgba(255,255,255,.94);box-shadow:0 14px 38px rgba(38,70,103,.15),inset 0 1px 0 #fff;backdrop-filter:blur(30px) saturate(1.35);-webkit-backdrop-filter:blur(30px) saturate(1.35)}
.nav button{border:0;min-width:0;min-height:58px;border-radius:18px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:800;color:#60778d}.nav button b{font-size:18px;line-height:1;font-weight:700}.nav button.active{background:rgba(255,255,255,.94);color:#1476df;box-shadow:0 5px 16px rgba(47,82,116,.08)}
.sheet{position:fixed;z-index:50;inset:0;background:rgba(20,35,50,.16);display:none;align-items:flex-end;justify-content:center;padding:12px}.sheet.open{display:flex}.sheetbox{width:min(410px,100%);border-radius:26px;padding:10px;background:rgba(248,252,255,.94);box-shadow:0 20px 60px rgba(30,55,80,.22);backdrop-filter:blur(28px)}.sheetbox h3{margin:8px 8px 10px;font-size:17px}.choice{width:100%;min-height:52px;border:0;border-top:1px solid #e0e9f0;background:transparent;text-align:left;padding:8px 10px;font-weight:750}.choice:first-of-type{border-top:0}
@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.context{padding:11px}.audience{padding-left:3px;padding-right:3px}.metric{padding:6px 5px}.metric small,.lead small{font-size:11px}.metric b{font-size:18px}.spaces button{font-size:13px}.nav{width:calc(100vw - 14px)}.nav button{font-size:11px}}
.important-more{border:0;border-top:1px solid rgba(157,98,64,.13);width:100%;min-height:44px;padding:7px 12px;background:#fff9f2;display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#806f62}.important-more b{color:#98603f;font-size:12px}.title .create-post{border:0;min-height:36px;padding:0 11px;border-radius:12px;background:#1476df;color:white;font-size:12px;font-weight:850}@media(max-width:370px){.hotkeys{gap:4px;padding:0 7px}.hotkeys button{font-size:10.5px}.title .create-post{padding:0 9px}}.function-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:2px 10px 11px}.function-grid button{border:0;min-width:0;min-height:68px;border-radius:15px;background:rgba(237,245,251,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:800;color:#536d83}.function-grid button b{font-size:19px;color:#1476df}.function-grid button:nth-child(3) b{color:#9d6240}@media(max-width:370px){.leads.four .lead{padding:6px 4px}.leads.four .lead small{font-size:10.5px}.function-grid{gap:4px;padding-left:7px;padding-right:7px}.function-grid button{font-size:10.5px}}.content-compact{padding-bottom:10px}.content3{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;padding:2px 10px 10px}.content3 button{border:0;min-width:0;min-height:82px;border-radius:16px;padding:9px;text-align:left}.addpost{background:#1476df!important;color:white;display:flex;flex-direction:column;justify-content:center;gap:5px}.addpost b{font-size:23px;line-height:1}.addpost span{font-size:13px;font-weight:850;line-height:1.15}.poststate{background:rgba(237,245,251,.78)}.poststate small{display:block;font-size:10.5px;color:#74889a}.poststate b{display:block;font-size:12px;line-height:1.2;margin-top:5px}.poststate span{display:block;font-size:10.5px;line-height:1.2;color:#1476df;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.function-grid.eight{grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:68px}.function-grid.eight button{min-height:68px}.function-grid.eight button:nth-child(3) b,.function-grid.eight button:nth-child(7) b{color:#9d6240}@media(max-width:370px){.content3{padding-left:7px;padding-right:7px;gap:4px}.content3 button{padding:7px}.addpost span{font-size:12px}.poststate b{font-size:11.5px}.function-grid.eight button{font-size:10px}}.stats-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid rgba(91,119,145,.13);border-bottom:1px solid rgba(91,119,145,.13)}.stats-grid button{border:0;background:transparent;min-width:0;min-height:70px;padding:9px 7px;text-align:center}.stats-grid button+button{border-left:1px solid rgba(91,119,145,.13)}.stats-grid small,.stats-grid span{display:block;font-size:10.5px;color:#7b8d9d}.stats-grid b{display:block;font-size:18px;line-height:1.15;margin:4px 0;color:#253f55}.stats-open{border:0;width:100%;min-height:46px;padding:7px 12px;background:transparent;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:12px;color:#637b8f}.stats-open b{font-size:12px;color:#1476df}.nav button:nth-child(3) b{width:32px;height:32px;border-radius:12px;background:#1476df;color:#fff;display:grid;place-items:center;font-size:20px;margin:-7px auto 1px}.service-card{padding-bottom:5px}.service-rows button{width:100%;border:0;border-top:1px solid rgba(91,119,145,.13);background:transparent;min-height:61px;padding:8px 11px;display:flex;align-items:center;gap:10px;text-align:left}.service-icon{flex:0 0 36px;width:36px;height:36px;border-radius:12px;background:rgba(228,239,248,.8);display:grid;place-items:center;color:#466b89;font-size:17px;font-weight:850}.service-rows .rowtext{min-width:0;flex:1}.service-rows .rowtext b{display:block;font-size:13px}.service-rows .rowtext small{display:block;font-size:11px;color:#7b8d9d;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.service-rows .go{font-size:11px;color:#1476df;font-weight:800}.title{min-height:38px;padding:10px 13px 7px;font-size:14px;line-height:1.2;font-weight:800;color:#63798c}.title>span:first-child{font-size:14px;font-weight:800;color:#63798c}.title>span:last-child:not(:first-child){font-size:12px;font-weight:650;color:#8393a2}.metric,.lead{text-align:center}.metric small,.lead small{min-height:29px;font-size:12px;line-height:1.2}.metric b,.lead b{font-size:20px;line-height:1.1}.rowtext b,.content b,.campaign b{font-size:15px;font-weight:800}.rowtext small,.content small,.campaign small{font-size:13px;line-height:1.25}.function-grid button{font-size:12px}.function-grid.eight button{font-size:12px}.poststate small,.poststate span,.stats-grid small,.stats-grid span,.service-rows .rowtext small,.service-rows .go{font-size:11px}.poststate b,.stats-open,.stats-open b{font-size:12px}.service-rows .rowtext b{font-size:14px}.nav button{font-size:11px}@media(max-width:370px){.metric small,.lead small{font-size:11px}.function-grid.eight button{font-size:11px}.leads.four .lead small{font-size:11px}}</style></head><body><main class="app">
<section class="context glass"><div class="brandrow"><div class="brand"><b>AdminK<i>IT</i></b><span>от PRAMIO.RU</span></div><div class="surface-links"><button data-exit="max" aria-label="Перейти в MAX">MAX</button><button data-exit="web" aria-label="Перейти в Web-панель">Web</button></div></div><button class="channel" id="channelBtn"><span><small>Выбранный канал</small><strong id="channelName">Тётя Лида знает</strong></span><em>Выбрать ›</em></button></section>
<section class="card glass"><div class="title"><span>Аудитория · <b id="moscowDate">25 сентября</b></span><span>00:00–<b id="moscowTime">14:00</b> · МСК</span></div><div class="audience"><button class="metric sub"><small>Подписались</small><b>+41</b></button><button class="metric unsub"><small>Отписались</small><b>−7</b></button><button class="metric delta pos"><small>Изменение</small><b>+34</b></button><button class="metric total"><small>Всего</small><b>4 826</b></button></div></section>
<section class="card glass"><div class="title"><span>Важное</span><span>3 события</span></div><button class="alert"><span class="ico">!</span><span class="rowtext"><b>2 лида ждут ответа</b><small>Новые обращения требуют реакции</small></span><span class="go">Открыть</span></button><button class="important-more"><span>Ещё 2 события требуют внимания</span><b>Показать ›</b></button></section>
<section class="card glass"><div class="title">Лиды</div><div class="leads four"><button class="lead new"><small>Неотвеченные</small><b>2</b></button><button class="lead work"><small>В работе</small><b>4</b></button><button class="lead done"><small>Отвеченные</small><b>18</b></button><button class="lead stale"><small>Неактуальные</small><b>3</b></button></div></section>
<section class="card glass content-compact"><div class="title"><span>Контент</span></div><div class="content3"><button class="addpost"><b>＋</b><span>Добавить пост</span></button><button class="poststate"><small>Запланировано</small><b>Сегодня · 19:30</b><span>«Осенняя капсула»</span></button><button class="poststate"><small>Последний пост</small><b>Сегодня · 09:15</b><span>Открыть ›</span></button></div></section>
<section class="card glass postwork-new"><div class="title"><span>Работа с постом</span><span>функция → выбор поста</span></div><div class="function-grid eight"><button data-fn="buttons"><b>▣</b><span>Кнопка</span></button><button data-fn="polls"><b>●</b><span>Опрос</span></button><button data-fn="gifts"><b>◆</b><span>Лид-магнит</span></button><button data-fn="editor"><b>✎</b><span>Редактор</span></button><button data-fn="comments"><b>◌</b><span>Комментарии</span></button><button data-fn="moderation"><b>◇</b><span>Модерация</span></button><button data-fn="highlight"><b>★</b><span>Выделение</span></button><button data-fn="stats"><b>▥</b><span>Статистика</span></button></div></section>
<section class="card glass"><div class="title">Продвижение</div><button class="campaign"><span class="ico">↗</span><span class="rowtext"><b>Рекламные кампании</b><small>Ссылки, источники и результаты</small></span><span class="go">Перейти</span></button></section>
<section class="card glass stats-home"><div class="title"><span>Статистика</span><span>25 сентября · МСК</span></div><div class="stats-grid"><button><small>Просмотры</small><b>6 284</b><span>сегодня</span></button><button><small>Вовлечение</small><b>8,4%</b><span>посты</span></button><button><small>Лиды</small><b>24</b><span>сегодня</span></button></div><button class="stats-open"><span>Вся статистика канала и постов</span><b>Открыть ›</b></button></section>
<section class="card glass service-card"><div class="title"><span>Личный кабинет</span></div><div class="service-rows"><button><span class="service-icon">◇</span><span class="rowtext"><b>Тариф и подписка</b><small>PRO · управление тарифом и лимитами</small></span><span class="go">Открыть</span></button><button><span class="service-icon">◎</span><span class="rowtext"><b>Настройки</b><small>Аккаунт, уведомления и доступы</small></span><span class="go">Открыть</span></button></div></section>
<section class="card glass service-card"><div class="title"><span>Информация и поддержка</span></div><div class="service-rows"><button><span class="service-icon">?</span><span class="rowtext"><b>Помощь и поддержка</b><small>Ответы, инструкции и обращение в поддержку</small></span><span class="go">Открыть</span></button><button><span class="service-icon">i</span><span class="rowtext"><b>Об AdminKIT</b><small>Информация о сервисе и документация</small></span><span class="go">Открыть</span></button></div></section>
</main><nav class="nav glass"><button class="active"><b>⌂</b>Главная</button><button><b>▤</b>Контент</button><button><b>＋</b>Создать</button><button><b>♙</b>Лиды</button><button><b>▥</b>Статистика</button></nav>
<div class="sheet" id="sheet"><div class="sheetbox"><h3>Выберите канал</h3><button class="choice">Тётя Лида знает</button><button class="choice">Olga.style</button><button class="choice">PRAMIO</button></div></div>
<script>
function updateMoscowClock(){const now=new Date(),parts=new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(now),get=t=>parts.find(p=>p.type===t)?.value||'';document.getElementById('moscowDate').textContent=get('day')+' '+get('month');document.getElementById('moscowTime').textContent=get('hour')+':'+get('minute')}updateMoscowClock();setInterval(updateMoscowClock,60000);
const sheet=document.getElementById('sheet'),nameEl=document.getElementById('channelName');
document.getElementById('channelBtn').onclick=()=>sheet.classList.add('open');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open')};
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{nameEl.textContent=b.textContent;sheet.classList.remove('open')});

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
</script></body></html>
