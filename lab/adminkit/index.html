<!doctype html><html lang="ru"><head>
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AdminKIT Design Lab</title>
<style>
*{box-sizing:border-box}html{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#132238;background:#eef4f8}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 5%,#dceeff 0,transparent 34%),radial-gradient(circle at 90% 20%,#f5e9df 0,transparent 28%),linear-gradient(145deg,#f7fafc,#eaf1f7)}
button{font:inherit}button:focus-visible{outline:3px solid #2b78e4;outline-offset:2px}.labbar{position:relative;z-index:30;max-width:1180px;margin:0 auto 28px;border:1px solid rgba(112,137,163,.18);border-radius:22px;display:flex;gap:10px;align-items:center;padding:12px max(14px,env(safe-area-inset-left));background:rgba(245,249,252,.84);backdrop-filter:blur(24px);border-bottom:1px solid rgba(112,137,163,.18)}.brand{font-weight:800;font-size:17px;letter-spacing:-.02em}.brand span{color:#2474df}.switches{display:flex;gap:6px;margin-left:auto;overflow:auto}.switches button,.surface button{border:0;min-height:44px;padding:0 14px;border-radius:14px;background:#e8eef4;color:#53667c;font-weight:700;font-size:14px;white-space:nowrap}.switches button.on,.surface button.on{background:#fff;color:#1768d2;box-shadow:0 5px 18px #7890aa22}.surface{display:flex;gap:6px}
.stage{max-width:1440px;margin:auto;padding:12px 20px 8px}.concept-note{display:flex;gap:12px;align-items:flex-start;margin:16px auto 10px;max-width:1180px;padding:14px 16px;border:1px solid #ffffffaa;background:#ffffff88;border-radius:20px;backdrop-filter:blur(18px);font-size:14px;line-height:1.45;color:#52677e}.concept-note b{color:#14283f}
.shell{--accent:#1871e7;--soft:#eaf3ff;--glass:rgba(255,255,255,.72);--line:rgba(92,122,154,.16);--shadow:0 18px 55px rgba(45,78,111,.12);display:grid;grid-template-columns:250px 1fr;min-height:790px;max-width:1180px;margin:auto;border:1px solid #ffffffc9;border-radius:32px;overflow:hidden;background:rgba(245,249,252,.7);box-shadow:0 35px 100px #506d8c24;backdrop-filter:blur(28px)}
.c2{--accent:#116d72;--soft:#e6f4f2;background:rgba(249,250,247,.78)}.c3{--accent:#2854a8;--soft:#edf1fb;background:rgba(248,249,252,.8)}
.side{padding:22px 14px;border-right:1px solid var(--line);background:rgba(255,255,255,.42)}.logo{padding:0 10px 22px;font-size:20px;font-weight:850}.logo i{font-style:normal;color:var(--accent)}.nav{display:grid;gap:4px}.nav button{border:0;min-height:48px;border-radius:15px;background:transparent;text-align:left;padding:0 13px;font-weight:650;color:#53667a}.nav button.active{background:var(--soft);color:var(--accent)}.side-foot{margin-top:26px;padding:13px;border-radius:16px;background:#ffffff94;font-size:13px;line-height:1.4;color:#65778a}
.main{min-width:0;padding:24px 28px 32px}.head{display:flex;align-items:center;gap:12px;margin-bottom:22px}.head h1{font-size:28px;line-height:1.15;letter-spacing:-.035em;margin:0}.head p{margin:5px 0 0;color:#65778b;font-size:15px}.avatar{margin-left:auto;width:44px;height:44px;border-radius:15px;background:var(--soft);display:grid;place-items:center;color:var(--accent);font-weight:800}
.summary{display:grid;grid-template-columns:1.35fr .65fr;gap:14px;margin-bottom:14px}.hero,.attention,.panel,.metric{border:1px solid #ffffffc8;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(22px)}.hero{padding:22px;border-radius:26px}.eyebrow{font-size:13px;color:var(--accent);font-weight:800}.hero h2{font-size:24px;letter-spacing:-.025em;margin:6px 0 7px}.hero p{font-size:15px;line-height:1.5;color:#60758a;margin:0}.primary{margin-top:18px;border:0;min-height:46px;padding:0 18px;border-radius:15px;background:var(--accent);color:#fff;font-weight:750}.attention{padding:18px;border-radius:26px}.attention strong{font-size:16px}.attention .count{font-size:34px;font-weight:850;color:var(--accent);margin:8px 0 3px}.attention small{font-size:14px;color:#677b8f}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.metric{padding:16px;border-radius:20px}.metric small{display:block;color:#6c7e90;font-size:13px}.metric b{display:block;margin-top:5px;font-size:24px;letter-spacing:-.03em}.metric em{font-style:normal;color:#3d8b63;font-size:13px}
.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.panel{border-radius:24px;padding:18px}.panel h3{font-size:17px;margin:0 0 13px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.action{border:1px solid var(--line);background:#ffffffa8;border-radius:17px;min-height:86px;padding:13px;text-align:left}.action b{display:block;font-size:15px}.action span{display:block;font-size:13px;line-height:1.35;color:#6b7d90;margin-top:5px}.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;min-height:58px;padding:8px;border-radius:15px;background:#ffffff8c}.ico{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--accent);display:grid;place-items:center;font-weight:850}.row b{font-size:14px}.row small{display:block;font-size:13px;color:#718294;margin-top:2px}.pill{font-size:12px;color:var(--accent);font-weight:750;background:var(--soft);padding:6px 8px;border-radius:999px}
.page{display:none}.page.on{display:block}.function-head{margin-bottom:16px}.function-head h2{font-size:24px;margin:0 0 5px}.function-head p{font-size:15px;color:#667a8f;margin:0}.catalog{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.feature{border:1px solid #ffffffc9;background:var(--glass);border-radius:22px;padding:17px;min-height:150px;box-shadow:var(--shadow)}.feature .ico{margin-bottom:20px}.feature b{font-size:16px}.feature p{font-size:13px;line-height:1.45;color:#687b8e;margin:6px 0}.feature button{border:0;background:transparent;color:var(--accent);font-weight:750;padding:8px 0;min-height:44px}
.mobilebar{display:none}
.c2 .summary{grid-template-columns:1fr;margin-bottom:8px}.c2 .hero{display:flex;align-items:center;padding:15px 18px;border-radius:18px}.c2 .hero h2{font-size:19px;margin:3px 0}.c2 .hero p{display:none}.c2 .primary{margin:0 0 0 auto}.c2 .attention{display:none}.c2 .metrics{grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#ffffff80}.c2 .metric{display:block;border:0;border-radius:0;box-shadow:none;background:transparent;padding:11px 14px}.c2 .metric+.metric{border-left:1px solid var(--line)}.c2 .metric b{font-size:20px}.c2 .metric em{display:none}.c2 .grid{grid-template-columns:1fr 1fr}.c2 .panel{border-radius:18px;box-shadow:none}.c2 .actions{display:grid;grid-template-columns:1fr 1fr}.c2 .action{min-height:58px;border-radius:12px}.c2 .action span{display:none}
.c3 .summary{grid-template-columns:1fr}.c3 .hero{min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(145deg,rgba(255,255,255,.92),rgba(228,238,253,.76))}.c3 .hero h2{font-size:30px;max-width:520px}.c3 .hero p{max-width:600px}.c3 .attention{display:none}.c3 .metrics{grid-template-columns:repeat(4,1fr)}.c3 .metric{box-shadow:none;background:transparent;border-color:var(--line)}.c3 .grid{grid-template-columns:.72fr 1.28fr}.c3 .actions{grid-template-columns:1fr}.c3 .action{min-height:60px}.c3 .action span{display:inline;margin-left:6px}
@media(max-width:760px){.labbar{flex-wrap:wrap;margin:8px 8px 22px}.brand{width:100%}.switches{margin-left:0;flex:1}.surface{margin-left:auto}.stage{padding:6px 8px 4px}.concept-note{margin:14px 4px 10px;border-radius:17px}.shell{display:block;min-height:780px;border-radius:26px}.side{display:none}.main{padding:18px 14px 98px}.head{margin-bottom:16px}.head h1{font-size:26px}.head p{font-size:15px}.summary,.c2 .summary{grid-template-columns:1fr;gap:9px}.c2 .hero{display:flex;padding:13px 14px}.c2 .hero .eyebrow{font-size:11px}.c2 .hero h2{font-size:18px}.c2 .primary{min-height:42px;padding:0 12px;font-size:12px}.c2 .metrics{grid-template-columns:1fr 1fr;border-radius:16px}.c2 .metric,.c2 .metric:nth-child(3){border-left:0}.c2 .metric:nth-child(even){border-left:1px solid var(--line)}.c2 .metric:nth-child(n+3){border-top:1px solid var(--line)}.c2 .grid{grid-template-columns:1fr}.c2 .actions{grid-template-columns:1fr 1fr}.c2 .action{min-height:54px}.c3 .hero{min-height:300px;padding:22px}.c3 .hero h2{font-size:29px}.c3 .metrics{display:none}.c3 .grid{grid-template-columns:1fr}.c3 .actions{grid-template-columns:1fr 1fr}.c3 .action{min-height:72px}.hero{padding:18px;border-radius:22px}.hero h2{font-size:22px}.c2 .hero{display:block}.attention{display:none}.metrics,.c2 .metrics{grid-template-columns:repeat(2,1fr);gap:8px}.metric,.c2 .metric{display:block;padding:14px;min-height:92px}.metric small{font-size:13px}.metric b,.c2 .metric b{font-size:23px}.grid,.c3 .grid{grid-template-columns:1fr;gap:10px}.panel{padding:15px;border-radius:21px}.actions,.c2 .actions,.c3 .actions{grid-template-columns:repeat(2,1fr);gap:7px}.action,.c2 .action,.c3 .action{min-height:92px;padding:12px}.action b{font-size:15px}.action span{font-size:13px}.catalog{grid-template-columns:1fr}.feature{min-height:118px}.mobilebar{position:fixed;z-index:20;left:18px;right:18px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:5px;border:1px solid #ffffffd9;border-radius:23px;background:rgba(248,251,253,.82);box-shadow:0 16px 48px #405e7c2e;backdrop-filter:blur(28px)}.mobilebar button{border:0;min-height:56px;border-radius:17px;background:transparent;color:#63768a;font-size:11px;font-weight:750}.mobilebar button.active{background:var(--soft);color:var(--accent)}}
</style></head><body>
<main class="stage"><div class="shell c1" id="shell">
<aside class="side"><div class="logo">PRAM<i>IO</i> · AdminKIT</div><nav class="nav" id="nav"></nav><div class="side-foot"><b>Демо-лаборатория</b><br>Все разделы интерактивны. Здесь принимаем IA, плотность и визуальную систему — без production backend.</div></aside>
<section class="main"><header class="head"><div><h1 id="title">Добрый вечер</h1><p id="subtitle">Olga.style · всё важное на одном экране</p></div><div class="avatar">AP</div></header><div id="content"></div></section>
<nav class="mobilebar" id="mobilebar"></nav></div><div class="concept-note" id="note"></div></main><header class="labbar"><div class="brand">AdminKIT <span>Design Lab</span></div><div class="switches"><button data-concept="1" class="on">01 · Focus</button><button data-concept="2">02 · Workspace</button><button data-concept="3">03 · Flow</button></div><div class="surface"><button data-surface="mini" class="on">Mini</button><button data-surface="web">Web</button></div></header>
<script>
const features=[['home','Главная'],['channels','Каналы'],['content','Контент'],['growth','Продвижение'],['gifts','Лид-магниты'],['buttons','Кнопки'],['polls','Опросы'],['automation','Автоматизации'],['leads','Лиды / CRM'],['stats','Статистика'],['settings','Настройки']];
const notes={1:'<b>01 · Focus.</b> Самый спокойный вариант: dashboard отвечает только на «что происходит / что требует внимания / что сделать сейчас». Функции вынесены в отдельный каталог.',2:'<b>02 · Workspace.</b> Более операционный вариант: меньше карточек, больше плотных рабочих списков. На desktop ближе к кабинету, на mobile сохраняет ту же IA.',3:'<b>03 · Flow.</b> Вариант вокруг действий: главная быстрее ведёт в создание механики, контента или кампании; текущая работа и статусы остаются рядом.'};
let concept=1,page='home',surface='mini';
const actions=[['＋','Новая публикация','Создать или запланировать'],['↗','Продвижение','Ссылка и кампания'],['◆','Лид-магнит','Выдача материала'],['▣','Кнопка','Действие под постом'],['●','Опрос','Вопрос и варианты'],['⚡','Автоматизация','Сценарий по событию']];
function dashboard(){return '<div class="summary"><div class="hero"><div><span class="eyebrow">Сегодня · 24 сентября</span><h2>Работа идёт штатно</h2><p>29 каналов активны. Одна публикация запланирована, два лида требуют ответа.</p></div><button class="primary" data-go="content">Создать публикацию</button></div><div class="attention"><strong>Требует внимания</strong><div class="count">2</div><small>новых лида без ответа</small></div></div><div class="metrics"><div class="metric"><small>Участники</small><b>4 826</b><em>+41 сегодня</em></div><div class="metric"><small>Клики</small><b>19</b><em>сегодня</em></div><div class="metric"><small>Новые лиды</small><b>6</b><em>2 ждут ответа</em></div><div class="metric"><small>Активные каналы</small><b>29</b><em>все доступны</em></div></div><div class="grid"><div class="panel"><h3>Быстрые действия</h3><div class="actions">'+actions.map((a,i)=>'<button class="action" data-go="'+features[[2,3,4,5,6,7][i]][0]+'"><b>'+a[0]+' '+a[1]+'</b><span>'+a[2]+'</span></button>').join('')+'</div></div><div class="panel"><h3>Сейчас</h3><div class="list"><div class="row"><div class="ico">12</div><div><b>Капсула на осень</b><small>Публикация · сегодня, 21:30</small></div><span class="pill">Готово</span></div><div class="row"><div class="ico">2</div><div><b>Новые лиды</b><small>Анна и Елена ждут ответа</small></div><span class="pill">Открыть</span></div><div class="row"><div class="ico">29</div><div><b>Каналы</b><small>Все ACTIVE, ошибок нет</small></div><span class="pill">ОК</span></div></div></div></div>'}
function catalog(id){const map={channels:['Каналы и чаты','Единое управление подключениями','29','Активных каналов'],content:['Контент','Публикации, черновики и расписание','＋','Новая публикация'],growth:['Продвижение','Кампании и отслеживаемые ссылки','↗','Создать кампанию'],gifts:['Лид-магниты','Выдача материалов по условиям','◆','Новый лид-магнит'],buttons:['Кнопки','Действия под публикациями','▣','Добавить кнопку'],polls:['Опросы','Вопросы, голоса и результаты','●','Создать опрос'],automation:['Автоматизации','Сценарии по событиям','⚡','Новый сценарий'],leads:['Лиды / CRM','Контакты, статусы и задачи','6','Новых лидов'],stats:['Статистика','Участники, клики и конверсии','19','Кликов сегодня'],settings:['Настройки','Аккаунт, команда и продукт','AP','Профиль']};const m=map[id]||map.content;return '<div class="function-head"><h2>'+m[0]+'</h2><p>'+m[1]+'</p></div><div class="catalog"><div class="feature"><div class="ico">'+m[2]+'</div><b>'+m[3]+'</b><p>Рабочий экран демонстрирует будущую компоновку поверх существующего backend owner.</p><button>Открыть →</button></div><div class="feature"><div class="ico">✓</div><b>Текущее состояние</b><p>Канонические данные, понятный статус и только необходимые действия.</p><button>Подробнее →</button></div><div class="feature"><div class="ico">⌁</div><b>История и результат</b><p>Последние изменения и ключевые показатели без декоративной аналитики.</p><button>Посмотреть →</button></div></div><div class="panel" style="margin-top:12px"><h3>Последняя активность</h3><div class="list"><div class="row"><div class="ico">1</div><div><b>Olga.style</b><small>Изменено 18 минут назад</small></div><span class="pill">ACTIVE</span></div><div class="row"><div class="ico">2</div><div><b>Канал PRAMIO</b><small>Синхронизировано сегодня</small></div><span class="pill">ACTIVE</span></div></div></div>'}
function render(){document.getElementById('shell').className='shell c'+concept+(surface==='mini'?' mini':' web');document.getElementById('note').innerHTML=notes[concept];document.querySelectorAll('[data-concept]').forEach(b=>b.classList.toggle('on',+b.dataset.concept===concept));document.querySelectorAll('[data-surface]').forEach(b=>b.classList.toggle('on',b.dataset.surface===surface));const nav=document.getElementById('nav');nav.innerHTML=features.map(x=>'<button class="'+(x[0]===page?'active':'')+'" data-page="'+x[0]+'">'+x[1]+'</button>').join('');document.getElementById('mobilebar').innerHTML=[features[0],features[2],features[8],features[9],['more','Ещё']].map(x=>'<button class="'+(x[0]===page?'active':'')+'" data-page="'+x[0]+'">'+x[1]+'</button>').join('');document.getElementById('content').innerHTML=page==='home'?dashboard():page==='more'?'<div class="function-head"><h2>Все функции</h2><p>Один уровень навигации без скрытых агрегаторов.</p></div><div class="catalog">'+features.slice(1).map(x=>'<button class="feature" data-page="'+x[0]+'" style="text-align:left"><div class="ico">›</div><b>'+x[1]+'</b><p>Открыть рабочий раздел</p></button>').join('')+'</div>':catalog(page);document.getElementById('title').textContent=page==='home'?'Добрый вечер':features.find(x=>x[0]===page)?.[1]||'Все функции';document.getElementById('subtitle').textContent=surface==='mini'?'Olga.style · Mini App':'Olga.style · Web workspace';bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()})}
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{concept=+b.dataset.concept;render()});document.querySelectorAll('[data-surface]').forEach(b=>b.onclick=()=>{surface=b.dataset.surface;render()});render();
</script></body></html>
