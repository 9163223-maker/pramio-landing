</style></head><body>
<main class="stage"><div class="shell c1" id="shell">
<aside class="side"><div class="logo">PRAM<i>IO</i> · AdminKIT</div><nav class="nav" id="nav"></nav><div class="side-foot"><b>Демо-лаборатория</b><br>Все разделы интерактивны. Здесь принимаем IA, плотность и визуальную систему — без production backend.</div></aside>
<section class="main"><header class="head"><div><h1 id="title">Добрый вечер</h1><p id="subtitle">Olga.style · всё важное на одном экране</p></div><div class="avatar">AP</div></header><div id="content"></div></section>
<nav class="mobilebar" id="mobilebar"></nav></div><div class="concept-note" id="note"></div></main><header class="labbar"><div class="brand">AdminKIT <span>Design Lab</span></div><div class="switches"><button data-concept="1" class="on">01</button><button data-concept="2">02</button><button data-concept="3">03</button><button data-concept="4">04</button><button data-concept="5">05</button><button data-concept="6">06</button><button data-concept="7">07</button><button data-concept="8">08</button><button data-concept="9">09</button><button data-concept="10">10</button></div><div class="surface"><button data-surface="mini" class="on">Mini</button><button data-surface="web">Web</button></div></header>
<script>
const features=[['home','Главная'],['channels','Каналы'],['content','Контент'],['growth','Продвижение'],['gifts','Лид-магниты'],['buttons','Кнопки'],['polls','Опросы'],['automation','Автоматизации'],['leads','Лиды / CRM'],['stats','Статистика'],['settings','Настройки']];
const notes={1:'<b>01 · Focus.</b> Самый спокойный вариант: dashboard отвечает только на «что происходит / что требует внимания / что сделать сейчас». Функции вынесены в отдельный каталог.',2:'<b>02 · Workspace.</b> Более операционный вариант: меньше карточек, больше плотных рабочих списков. На desktop ближе к кабинету, на mobile сохраняет ту же IA.',3:'<b>03 · Flow.</b> Вариант вокруг действий: главная быстрее ведёт в создание механики, контента или кампании; текущая работа и статусы остаются рядом.'};
let concept=1,page='home',surface='mini';
const actions=[['＋','Новая публикация','Создать или запланировать'],['↗','Продвижение','Ссылка и кампания'],['◆','Лид-магнит','Выдача материала'],['▣','Кнопка','Действие под постом'],['●','Опрос','Вопрос и варианты'],['⚡','Автоматизация','Сценарий по событию']];

const conceptNames=['Clean Glass','Dark Glass','Focus Cards','Widget Mosaic','Minimal Bars','Channel Switch','Panel Stack','Action Focus','Analytics First','Elegant Compact'];
function icon(n){return '<i class="appicon i'+n+'">'+['＋','↗','◆','▣','●','⚡'][n%6]+'</i>'}
function appTile(n,t,sub,wide=''){return '<button class="app '+wide+'" data-go="'+['content','growth','gifts','buttons','polls','automation'][n%6]+'">'+icon(n)+'<span><b>'+t+'</b><small>'+sub+'</small></span><em>›</em></button>'}
function chooser(extra=''){return '<div class="choosers">'+appTile(0,'Рабочая область','Olga.style','bar')+appTile(1,'Канал','Все каналы · 29','bar')+'</div>'+extra}
function stats(){return '<button class="statstrip" data-go="stats"><span><small>Подписались</small><b>+41</b></span><span><small>Ушли</small><b>−7</b></span><span><small>Итого</small><b>4 826</b></span></button>'}
function six(cls=''){return '<div class="apps '+cls+'">'+appTile(0,'Пост','Создать')+appTile(1,'Реклама','Ссылка')+appTile(2,'Лид-магнит','Материал')+appTile(3,'Кнопка','Под постом')+appTile(4,'Опрос','Создать')+appTile(5,'Сценарий','Автоматизация')+'</div>'}
function dashboard(){
 if(concept===1)return '<div class="phoneconcept clean">'+chooser(stats())+six()+'</div>';
 if(concept===2)return '<div class="phoneconcept dark">'+chooser('<div class="bigmetric"><small>Аудитория</small><b>4 826</b><em>+41 сегодня</em></div>')+six()+'</div>';
 if(concept===3)return '<div class="phoneconcept focus">'+chooser(stats())+'<div class="focusgrid">'+appTile(0,'Публикация','Создать пост','heroapp')+appTile(1,'Рекламная ссылка','UTM и кампания','heroapp')+'</div>'+six('miniapps')+'</div>';
 if(concept===4)return '<div class="phoneconcept mosaic">'+chooser()+'<div class="mosaicgrid"><button class="mosaicmetric" data-go="stats"><small>Аудитория</small><b>4 826</b><em>+41</em></button><button class="mosaiclead" data-go="leads"><small>Лиды</small><b>6</b><em>2 новых</em></button>'+appTile(0,'Пост','Создать','mosaicbig')+appTile(1,'Рекламная ссылка','Кампания','mosaicbig')+'</div>'+six('minithree')+'</div>';
 if(concept===5)return '<div class="phoneconcept bars">'+chooser(stats())+'<div class="barlist">'+appTile(0,'Публикация','Создать пост','bar')+appTile(1,'Рекламная ссылка','Создать кампанию','bar')+appTile(2,'Лид-магнит','Выдать материал','bar')+appTile(3,'Кнопка','Под публикацией','bar')+appTile(4,'Опрос','Вопрос аудитории','bar')+appTile(5,'Сценарий','Автоматизация','bar')+'</div></div>';
 if(concept===6)return '<div class="phoneconcept channels">'+chooser(stats())+'<div class="channelhero"><small>Текущий канал</small><b>Olga.style</b><span>ACTIVE · 856 сегодня</span></div>'+six()+'</div>';
 if(concept===7)return '<div class="phoneconcept stack">'+chooser('<div class="twostats"><button data-go="stats"><small>Аудитория</small><b>4 826</b><em>+41</em></button><button data-go="leads"><small>Лиды</small><b>6</b><em>2 ждут</em></button></div>')+six()+'</div>';
 if(concept===8)return '<div class="phoneconcept actionfocus">'+chooser()+'<button class="actionhero" data-go="content">'+icon(0)+'<b>Создать публикацию</b><small>Новый пост или расписание</small></button><div class="actionpair">'+appTile(1,'Рекламная ссылка','Создать кампанию','heroapp')+appTile(2,'Лид-магнит','Выдать материал','heroapp')+'</div>'+six('miniapps')+'</div>';
 if(concept===9)return '<div class="phoneconcept analytics">'+chooser('<div class="chartmetric"><span><small>Аудитория</small><b>4 826</b><em>+41 сегодня</em></span><i>▂▃▄▅▆▇</i></div>'+stats())+six('compactapps')+'</div>';
 return '<div class="phoneconcept elegant">'+chooser(stats())+'<div class="elegantgrid">'+six()+'</div><button class="scenariofull" data-go="automation">⚡ <b>Сценарии</b><span>Автоматизация ›</span></button></div>'
}

function catalog(id){const map={channels:['Каналы и чаты','Единое управление подключениями','29','Активных каналов'],content:['Контент','Публикации, черновики и расписание','＋','Новая публикация'],growth:['Продвижение','Кампании и отслеживаемые ссылки','↗','Создать кампанию'],gifts:['Лид-магниты','Выдача материалов по условиям','◆','Новый лид-магнит'],buttons:['Кнопки','Действия под публикациями','▣','Добавить кнопку'],polls:['Опросы','Вопросы, голоса и результаты','●','Создать опрос'],automation:['Автоматизации','Сценарии по событиям','⚡','Новый сценарий'],leads:['Лиды / CRM','Контакты, статусы и задачи','6','Новых лидов'],stats:['Статистика','Участники, клики и конверсии','19','Кликов сегодня'],settings:['Настройки','Аккаунт, команда и продукт','AP','Профиль']};const m=map[id]||map.content;return '<div class="function-head"><h2>'+m[0]+'</h2><p>'+m[1]+'</p></div><div class="catalog"><div class="feature"><div class="ico">'+m[2]+'</div><b>'+m[3]+'</b><p>Рабочий экран демонстрирует будущую компоновку поверх существующего backend owner.</p><button>Открыть →</button></div><div class="feature"><div class="ico">✓</div><b>Текущее состояние</b><p>Канонические данные, понятный статус и только необходимые действия.</p><button>Подробнее →</button></div><div class="feature"><div class="ico">⌁</div><b>История и результат</b><p>Последние изменения и ключевые показатели без декоративной аналитики.</p><button>Посмотреть →</button></div></div><div class="panel" style="margin-top:12px"><h3>Последняя активность</h3><div class="list"><div class="row"><div class="ico">1</div><div><b>Olga.style</b><small>Изменено 18 минут назад</small></div><span class="pill">ACTIVE</span></div><div class="row"><div class="ico">2</div><div><b>Канал PRAMIO</b><small>Синхронизировано сегодня</small></div><span class="pill">ACTIVE</span></div></div></div>'}
function render(){document.getElementById('shell').className='shell c'+concept+(surface==='mini'?' mini':' web');document.getElementById('note').innerHTML='<b>'+String(concept).padStart(2,'0')+' · '+conceptNames[concept-1]+'</b> — HTML prototype, все элементы интерактивны.';document.querySelectorAll('[data-concept]').forEach(b=>b.classList.toggle('on',+b.dataset.concept===concept));document.querySelectorAll('[data-surface]').forEach(b=>b.classList.toggle('on',b.dataset.surface===surface));const nav=document.getElementById('nav');nav.innerHTML=features.map(x=>'<button class="'+(x[0]===page?'active':'')+'" data-page="'+x[0]+'">'+x[1]+'</button>').join('');document.getElementById('mobilebar').innerHTML=[['home','Главная'],['content','Контент'],['leads','Лиды'],['stats','Статистика'],['more','Ещё']].map(x=>'<button class="'+(x[0]===page?'active':'')+'" data-page="'+x[0]+'">'+x[1]+'</button>').join('');document.getElementById('content').innerHTML=page==='home'?dashboard():page==='more'?'<div class="function-head"><h2>Все функции</h2><p>Один уровень навигации без скрытых агрегаторов.</p></div><div class="catalog">'+features.slice(1).map(x=>'<button class="feature" data-page="'+x[0]+'" style="text-align:left"><div class="ico">›</div><b>'+x[1]+'</b><p>Открыть рабочий раздел</p></button>').join('')+'</div>':catalog(page);document.getElementById('title').textContent=page==='home'?'Добрый вечер':features.find(x=>x[0]===page)?.[1]||'Все функции';document.getElementById('subtitle').textContent=surface==='mini'?'Olga.style · Mini App':'Olga.style · Web workspace';bind()}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{page=b.dataset.go;render()})}
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{concept=+b.dataset.concept;render()});document.querySelectorAll('[data-surface]').forEach(b=>b.onclick=()=>{surface=b.dataset.surface;render()});render();
</script></body></html>
