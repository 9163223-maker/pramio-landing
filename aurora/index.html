<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НСМ · Западная Сибирь и Ямал · Clean 2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./app.css?v=3">
</head>
<body>
<div id="build" hidden>aurora-clean-2</div>\n<div id="map" aria-label="Карта НСМ"></div>
<header class="topbar">
  <div class="brand"><strong>НСМ · Западная Сибирь и Ямал</strong><small>данные 29.09.2026</small></div>
  <div class="filters" role="group" aria-label="Фильтр объектов">
    <button data-filter="all" class="active">Все</button><button data-filter="demand">Спрос</button><button data-filter="quarry">Карьеры</button><button data-filter="terminal">Перевалки</button><button data-filter="port">Порт/ЖД</button>
  </div>
  <div class="legend"><span><i class="demand"></i>спрос</span><span><i class="terminal"></i>перевалка</span><span><i class="quarry"></i>карьеры</span><span><i class="port"></i>порт/ЖД</span></div>
</header>
<aside id="detail" class="detail" hidden></aside>
<section id="planner" class="planner" aria-live="polite">
  <div class="route-row">
    <label><span>A · карьер</span><select id="origin"><option value="">Выберите карьер</option></select></label>
    <span class="arrow">→</span>
    <label><span>B · назначение</span><select id="destination" disabled><option value="">Сначала выберите A</option></select></label>
    <button id="fit" class="secondary">Регион</button>
  </div>
  <div id="hint" class="hint">Нажмите на карьер на карте — он станет точкой A.</div>
  <div id="result" class="result" hidden></div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./app.js?v=9"></script>
</body></html>
