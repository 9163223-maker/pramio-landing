name: Package mobile viewport lock
on:
  push:
    branches:
      - packaging/mobile-perfect-2026-09-21-v3
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production archive
        run: |
          rm -rf .git .github
          zip -r pramio-mobile-perfect-v53.zip . -x "config.local.php" "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: pramio-mobile-perfect-v53
          path: pramio-mobile-perfect-v53.zip
          retention-days: 7
