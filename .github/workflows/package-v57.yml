name: Package mobile repair v57
on:
  push:
    branches: [packaging/mobile-repair-v57]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf .git .github
          zip -r pramio-mobile-repair-v57.zip . -x "config.local.php" "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: pramio-mobile-repair-v57
          path: pramio-mobile-repair-v57.zip
          retention-days: 7
