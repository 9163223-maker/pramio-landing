name: PRAMIO design system guardrails
on:
  push:
    branches:
      - main
      - design/**
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.php'
      - 'site-v2.css'
      - 'site-v2.js'
      - 'scripts/check-design-system.mjs'
jobs:
  check-design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check site-v2.js
      - name: Check PRAMIO design tokens and public pages
        run: node scripts/check-design-system.mjs
