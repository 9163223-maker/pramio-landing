name: Package mobile consolidated v58
on:
  push:
    branches: [packaging/mobile-consolidated-v58]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          rm -rf .git .github
          zip -r pramio-mobile-consolidated-v58.zip . -x "config.local.php" "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: pramio-mobile-consolidated-v58
          path: pramio-mobile-consolidated-v58.zip
          retention-days: 7
