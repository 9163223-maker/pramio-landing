name: Aurora Pages Check
on:
  push:
    branches: [main]
    paths:
      - 'aurora/**'
      - '.github/workflows/aurora-pages-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean architecture contract
        run: |
          test -s aurora/index.html
          test -s aurora/app.css
          test -s aurora/app.js
          grep -q './app.css?v=2' aurora/index.html
          grep -q './app.js?v=2' aurora/index.html
          ! grep -q '<style' aurora/index.html
          ! grep -q '<script>' aurora/index.html
          grep -q 'id="origin"' aurora/index.html
          grep -q 'id="destination"' aurora/index.html
          test "$(grep -o 'function setA(' aurora/app.js | wc -l)" -eq 1
          test "$(grep -o 'function setB(' aurora/app.js | wc -l)" -eq 1
          ! grep -q 'circleMarker' aurora/app.js
          ! grep -q 'selectMapPoint' aurora/app.js
      - name: Graph integrity
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          let s=fs.readFileSync('aurora/app.js','utf8');
          const p=s.indexOf('const COLORS=');
          const data=s.slice(13,p);
          const ctx={}; vm.createContext(ctx);
          vm.runInContext(data.replace('const POINTS=','POINTS=').replace('const ROUTES=','ROUTES='),ctx);
          const ids=new Set(ctx.POINTS.map(x=>x.id));
          const missing=[...new Set(ctx.ROUTES.flatMap(r=>[r.a,r.b]).filter(x=>!ids.has(x)))];
          if(missing.length) throw new Error('Missing route objects: '+missing.join(','));
          console.log('objects='+ctx.POINTS.length,'routes='+ctx.ROUTES.length,'graph=OK');
          NODE
      - name: JavaScript syntax
        run: node --check aurora/app.js
      - name: External Leaflet asset
        run: curl -fsSL --retry 3 --max-time 20 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o /tmp/leaflet.js && test -s /tmp/leaflet.js
