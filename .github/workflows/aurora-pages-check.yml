name: Aurora Pages Check
on:
  push:
    branches: [main, Aurora]
    paths:
      - 'aurora/**'
      - '.github/workflows/aurora-pages-check.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Aurora HTML
        run: |
          test -s aurora/index.html
          grep -q '<div id="map"></div>' aurora/index.html
          grep -q 'leaflet@1.9.4' aurora/index.html
          grep -q 'Коротчаево' aurora/index.html
          grep -q 'Тамбей' aurora/index.html
          grep -q 'FreiCON' aurora/index.html
          grep -q '797500' aurora/index.html
          grep -q '306 км' aurora/index.html
          grep -q 'obj-label' aurora/index.html
          grep -q 'routeCard' aurora/index.html
          grep -q 'Водный транспорт' aurora/index.html
          grep -q 'fromSel' aurora/index.html
          grep -q 'toSel' aurora/index.html
          grep -q 'planner-result' aurora/index.html
          grep -q 'railRate' aurora/index.html
          grep -q 'roadRate' aurora/index.html
          grep -q 'waterRate' aurora/index.html
          grep -q 'Сценарная логистика' aurora/index.html
          grep -q 'id:"podg"' aurora/index.html
          grep -q 'id:"nyag"' aurora/index.html
      - name: Runtime graph integrity
        run: |
          python3 - <<'PY'
          import re
          s=open('aurora/index.html',encoding='utf-8').read()
          ids=set(re.findall(r'id:"([^"]+)",n:',s))
          edges=re.findall(r'\{a:"([^"]+)",b:"([^"]+)",t:',s)
          missing=sorted({x for e in edges for x in e if x not in ids})
          assert not missing, f"Routes reference missing objects: {missing}"
          print(f"objects={len(ids)} routes={len(edges)} graph=OK")
          PY
      - name: JavaScript syntax
        run: |
          python3 - <<'PY'
          import re
          s=open('aurora/index.html',encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          open('/tmp/aurora.js','w',encoding='utf-8').write('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/aurora.js
          echo "Aurora HTML validation passed"
      - name: Check external map assets
        run: |
          curl -fsSL --retry 3 --max-time 20 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o /tmp/leaflet.js
          test -s /tmp/leaflet.js
      - name: Report
        run: echo "Map source and external Leaflet asset are available"
