name: TLZ Blog Visual Lab

on:
  push:
    branches: [lab/blog-tlz-editorial]
    paths:
      - 'lab/blog-tlz/**'
      - '.github/workflows/tlz-blog-lab.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tlz-blog-lab-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate lab
        run: |
          test -s lab/blog-tlz/index.html
          grep -q 'PRAMIO EDITORIAL / VISUAL LAB 01' lab/blog-tlz/index.html
      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R lab/blog-tlz/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: tlz-blog-lab
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
