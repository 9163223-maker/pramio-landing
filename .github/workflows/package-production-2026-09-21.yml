name: Package production ZIP 2026-09-21
on:
  push:
    branches:
      - packaging/mobile-ux-2026-09-21
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production archive
        run: |
          rm -rf .git .github
          zip -r pramio-ux-final-2026-09-21.zip . -x "config.local.php" "*.DS_Store"
      - uses: actions/upload-artifact@v4
        with:
          name: pramio-ux-final-2026-09-21
          path: pramio-ux-final-2026-09-21.zip
          retention-days: 7
