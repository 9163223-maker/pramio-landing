name: Package PRAMIO production V14.8
on:
  push:
    branches: [packaging/portfolio-refresh-2026-10-16-v13]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: PHP syntax
        run: |
          set -eu
          for f in send.php scheduled-article.php sitemap-live.php blog/blog-feed.php blog/tetya-lida/index.php publish-content.php config.sample.php; do php -l "$f"; done
      - name: Functional DOM checks
        run: |
          npm install --prefix qa --no-audit --no-fund
          PRAMIO_TEST_ROOT=. node qa/verify.mjs
          PRAMIO_TEST_ROOT=. node qa/cms-verify.mjs
          PRAMIO_TEST_ROOT=. node qa/sales-verify.mjs
          PRAMIO_TEST_ROOT=. node qa/mobile-nav-verify.mjs
          PRAMIO_TEST_ROOT=. node qa/portfolio-actions-verify.mjs
          PRAMIO_TEST_ROOT=. php qa/publishing-verify.php
      - name: Validate source and package exact production manifest
        run: python3 scripts/package-production-v14.py
      - uses: actions/upload-artifact@v4
        with:
          name: PRAMIO-PRODUCTION-2026-10-19-V14-8-DEMO-CRM
          path: |
            PRAMIO-PRODUCTION-2026-10-19-V14-8-DEMO-CRM.zip
            PRAMIO-PRODUCTION-2026-10-19-V14-8-DEMO-CRM.sha256
          retention-days: 14
