<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>PRAMIO CMS — пример системы управления</title><link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./admin.css?v=2"></head><body><div class="bar"><a href="../">← Все примеры</a><span>Пример выполненной работы · универсальная CMS</span></div><header class="top"><b class="logo">PRAMIO <i>CMS</i></b><div class="project"><span>Проект</span><select id="project"><option value="clinic">Клиника «Север»</option><option value="shop">FORMA Store</option><option value="build">КОНТУР / ДОМА</option></select></div><span class="user">Администратор</span></header><div class="shell"><aside id="nav"></aside><main class="main"><div class="headline"><div><small id="kind"></small><h1 id="title"></h1></div><a id="siteLink">Открыть сайт ↗</a></div><section class="metrics" id="metrics"></section><div class="grid"><div><section class="box"><div class="boxhead"><h2 id="listTitle"></h2><button class="primary" id="add">+ Добавить</button></div><div id="list"></div></section><section class="box schedule"><h2>Управление доступностью</h2><div class="slots" id="slots"></div><p class="notice" id="hint"></p></section></div><section class="box fields"><h2 id="editorTitle"></h2><label id="nameLabel"></label><input id="name"><label id="specLabel"></label><input id="spec"><label>Описание</label><textarea id="bio" rows="5"></textarea><label>Статус</label><select id="status"><option>Опубликовано</option><option>Черновик</option><option>Скрыто</option></select><button class="primary save" id="save">Сохранить изменения</button><div class="notice" id="saved" hidden>Изменения сохранены в демо-режиме.</div><div class="preview"><small>ПРЕДПРОСМОТР</small><div id="preview"></div></div></section></div></main></div><script src="./admin.js?v=2"></script></body></html>
